; PlatformIO build for the sine-wave demo.
;   pio run -t upload && pio device monitor
; Arduino IDE users can ignore this file and open examples/sine_wave/sine_wave.ino.

[platformio]
src_dir = examples/sine_wave

[env:esp32dev]
platform = espressif32
board = esp32dev          ; ESP32-WROOM-32 DevKit (DOIT DevKit V1 and clones)
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
